[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lander"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "imageio>=2.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
